{% extends 'admin/change_list.html' %}

{% block extrahead %}{{ block.super }}
<script>
    function getCookie(name) {
        var cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            var cookies = document.cookie.split(';');
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function deleteProduct(event, productId) {
        event.preventDefault();
        if (!confirm("Are you sure you want to delete product #" + productId +
                "? This action cannot be undone.")) {
            return false;
        }
        fetch("delete/" + productId + "/", {
            method: "DELETE",
            headers: {"X-CSRFToken": getCookie("csrftoken"), "X-Requested-With": "XMLHttpRequest"}
        })
            .then(function (response) {
                return response.text().then(function (text) {
                    var data = {};
                    try { data = JSON.parse(text); } catch (e) {
                        data = {success: false,
                            message: "Unexpected server response (HTTP " + response.status + ")."};
                    }
                    return {ok: response.ok, data: data};
                });
            })
            .then(function (result) {
                alert(result.data.message || (result.ok ? "Deleted successfully." : "Delete failed."));
                if (result.ok && result.data.success) {
                    window.location.reload();  // refresh the product list
                }
            })
            .catch(function (err) {
                alert("An error occurred while deleting the product: " + err);
            });
        return false;
    }
</script>
{% endblock %}

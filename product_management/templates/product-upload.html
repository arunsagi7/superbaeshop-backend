<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
        integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous" />
    <style>
        .err-msg {
            font-size: 0.9rem;
            color: red;
        }

        .file-label {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #ced4da;
            height: 100px;
            flex-direction: column;
            cursor: pointer;
        }

        .file-label input {
            display: none;
        }

        .image-preview img {
            max-width: 200px;
        }
    </style>
</head>

<body>
    <div class="pt-5 container pb-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="pb-3">
                    <h3>Upload Product</h3>
                </div>
                <form id="upload-form" novalidate>
                    <div class="form-group">
                        <label for="sub_category" class="form-label">Category</label>
                        <select id="sub_category" class="form-control required-feild" required>
                            <option value="">Select an category</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="product_image" class="file-label bg-light">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="feather feather-upload">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <div class="pt-1">Upload Image</div>
                            <input id="product_image" type="file" class="reset-feild" required accept="image/*" />
                        </label>
                    </div>
                    <div id="image-preview" class="image-preview" style="max-width: 150px"></div>


                    <div class="row">
                        <div class="col-4 form-group">
                            <label for="original_price" class="form-label">Original Price</label>
                            <input id="original_price" class="form-control required-feild reset-feild"
                                placeholder="Enter original price" type="number" required />
                        </div>
                        <div class="col-4 form-group">
                            <label for="offer_price" class="form-label">Offer Price</label>
                            <input id="offer_price" class="form-control required-feild reset-feild"
                                placeholder="Enter offer price" type="number" required />
                        </div>
                        <div class="col-4 form-group">
                            <label for="pricing_category" class="form-label">Pricing Category</label>
                            <select id="pricing_category" class="form-control required-feild" required>
                                <option value="">Select an category</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="stock_qty" class="form-label">Quantity</label>
                        <input id="stock_qty" class="form-control required-feild reset-feild"
                            placeholder="Enter quantity" type="number" required />
                    </div>
                    <div class="form-group">
                        <button is="submit-btn" class="btn btn-block btn-dark">
                            Submit
                        </button>
                    </div>
                </form>
                <div id="sku-list"></div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script>
        const baseUrl = "/";
        const uploadUrl = "products/upload-product/";
        const masterUrl = "master-values/";

        const fields = [
            "pricing_category",
            "sub_category",
            "original_price",
            "offer_price",
            "stock_qty",
        ];
        function appendErr(el) {
            const parent = el.closest(".form-group");
            parent.find(".err-msg").remove();
            parent.append(
                `<div class="err-msg">This field is required</div>`
            );
        }
        function removeErr(el) {
            const parent = el.closest(".form-group");
            parent.find(".err-msg").remove();
        }
        function formSubmit(e) {
            e.preventDefault();
            const $image = $("#product_image");
            let isErr = false;
            if ($image[0].files.length === 0) {
                isErr = true;
                appendErr($image);
            }
            $(".required-feild").each((_, item) => {
                const el = $(item);
                if (!el.val()) {
                    isErr = true;
                    appendErr(el);
                }
            });
            if (isErr) {
                return;
            }
            let formData = new FormData();
            formData.append("product_image", $image[0].files[0]);
            fields.forEach((item) => {
                formData.append(item, $(`#${item}`).val());
            });
            $("#submit-btn").prop("disabled", true);
            $("#submit-btn").text("Uploading...");
            $.ajax({
                url: `${baseUrl}${uploadUrl}`,
                method: "POST",
                processData: false,
                mimeType: "multipart/form-data",
                contentType: false,
                data: formData,
            })
                .done(function (response) {
                    $(".reset-feild").val("");
                    $("#image-preview").empty();
                    const res = JSON.parse(response);
                    $("#sku-list").append(
                        `<div class="border p-3 mb-2">SKU : <b>${res.sku}</b></div>`
                    );
                })
                .fail(function (err) {
                    console.log(err);
                    alert("Error");
                })
                .always(function () {
                    $("#submit-btn").prop("disabled", false);
                    $("#submit-btn").text("Submit");
                });
        }
        function imagePreview(e) {
            removeErr($(this));
            if (e.target.files) {
                const objectURL = URL.createObjectURL(e.target.files[0]);
                $("#image-preview").empty();
                $("#image-preview").append(
                    `<img src="${objectURL}" alt="" class="form-group" />`
                );
            }
        }
        function renderOptions(cats) {
            return cats
                .map((x) => `<option value="${x.id}">${x.title}</option>`)
                .join("");
        }
        function appendCategories() {
            $.get(`${baseUrl}${masterUrl}`).done((res) => {
                console.log(res);
                $("#pricing_category").append(
                    renderOptions(res.pricing_category)
                );
                $("#sub_category").append(
                    res.category
                        .map(
                            (x) =>
                                `<optgroup label='${x.title}'>${renderOptions(
                                    x.sub_categories
                                )}</optgroup>`
                        )
                        .join("")
                );
            });
        }
        $(function () {
            appendCategories();
            $(".required-feild").change(function (e) {
                removeErr($(this));
            });
            $("#product_image").change(imagePreview);
            $("#upload-form").submit(formSubmit);
        });
    </script>
</body>

</html>

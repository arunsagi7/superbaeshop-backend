{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrahead %}{{ block.super }}
<style>
    .upload-form {
        max-width: 800px;
        margin: 20px auto;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
    }

    .form-group select,
    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .btn {
        padding: 10px 20px;
        background: #417690;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn:hover {
        background: #205067;
    }
</style>
{% endblock %}

{% block content %}
<div class="upload-form">
    <h2>Add Product</h2>
    <p>Use the form below to add a new product or import products via CSV.</p>
    <div class="form-group">
        <label for="category">Select Category & Pricing Category:</label>
        <select id="category" name="category">
            <option value="">-- Select Category --</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.title }} ({{ cat.super_category.title }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="pricing_category">Pricing Category:</label>
        <select id="pricing_category" name="pricing_category">
            <option value="1">A - Standard Pricing</option>
            <option value="2">B - Special Pricing</option>
        </select>
    </div>
    <button type="button" class="btn" onclick="alert('Product upload form submitted!')">Save Product</button>
</div>
{% endblock %}

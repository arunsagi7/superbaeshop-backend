<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        input {
            display: block;
            width: 100%;
            margin: 0.5rem 0;
            padding: 0.5rem;
        }

        button {
            background: #4a90e2;
            color: #fff;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Login</h2>
        <form method="post" action="/login/">
            {% csrf_token %}
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required />
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required />
            <button type="submit">Login</button>
        </form>
    </div>
</body>

</html>

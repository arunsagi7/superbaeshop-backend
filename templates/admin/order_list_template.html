{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrahead %}{{ block.super }}
<style>
    .order-table {
        width: 100%;
        border-collapse: collapse;
    }

    .order-table th {
        background: #417690;
        color: #fff;
        padding: 8px 12px;
        text-align: left;
        font-size: 12px;
    }

    .order-table td {
        padding: 8px 12px;
        border-bottom: 1px solid #eee;
        font-size: 13px;
    }

    .order-table tr:hover {
        background: #f5f5f5;
    }

    .status-badge {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="order-table">
    {{ block.super }}
</div>
{% endblock %}

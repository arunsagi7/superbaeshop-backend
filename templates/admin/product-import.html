{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrahead %}{{ block.super }}
<style>
    .table-container {
        max-width: 100%;
        overflow-x: auto;
    }

    .product-image {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 4px;
    }

    .status-badge {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
    }

    .status-active {
        background: #d4edda;
        color: #155724;
    }

    .status-inactive {
        background: #f8d7da;
        color: #721c24;
    }

    .status-pending {
        background: #fff3cd;
        color: #856404;
    }
</style>
{% endblock %}

{% block content %}
<div class="table-container">
    {{ block.super }}
</div>
{% endblock %}
